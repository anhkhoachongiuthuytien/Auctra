name: Java CI/CD with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Install Modules
      # Install modules so they are available for each other during test phase
      run: mvn -B clean install -DskipTests

    - name: Run Unit Tests
      run: xvfb-run mvn -B test -Dtest=!SceneNavigatorSmokeTest