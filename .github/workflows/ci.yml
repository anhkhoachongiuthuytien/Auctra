# Tên workflow hiển thị trên GitHub Actions.
name: Java CI

# Chạy workflow khi có push hoặc pull request.
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  # Job chính để build, test và kiểm tra coding convention trên nhiều hệ điều hành.
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Không dừng toàn bộ matrix nếu một hệ điều hành bị fail.
      fail-fast: false
      matrix:
        # Kiểm tra tính tương thích của Maven build trên cả 3 OS phổ biến.
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      # Lấy mã nguồn mới nhất từ repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cài JDK 17 và bật cache Maven để giảm thời gian build.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Chạy toàn bộ compile, test và checkstyle qua vòng đời verify.
      - name: Build, test, and run Checkstyle
        run: mvn -B verify
